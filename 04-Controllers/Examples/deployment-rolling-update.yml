apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-rolling-update
  namespace: default
  labels:
    app: web
spec:
  replicas: 4
  # Rolling update strategy - gradually replace old pods with new ones
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Maximum number of pods that can be created above desired replicas
      maxSurge: 2
      # Maximum number of pods that can be unavailable
      maxUnavailable: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        version: v1.0
    spec:
      containers:
      - name: app
        image: webapp:1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
