---
# Simple ConfigMap with literal key-value pairs
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  # Simple key-value pairs
  database.host: "postgres.default.svc.cluster.local"
  database.port: "5432"
  log.level: "info"
  app.environment: "production"

---
# ConfigMap with multi-line file content
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
data:
  # Multi-line YAML/JSON configuration
  application.yaml: |
    server:
      port: 8080
      host: 0.0.0.0
    database:
      host: postgres
      port: 5432
      pool_size: 20
    logging:
      level: info
      format: json
  
  # Another file
  features.json: |
    {
      "feature_a": true,
      "feature_b": false,
      "feature_c": {
        "enabled": true,
        "version": 2
      }
    }

---
# ConfigMap with ini file format
apiVersion: v1
kind: ConfigMap
metadata:
  name: app.ini
data:
  app.ini: |
    [server]
    host = 0.0.0.0
    port = 8080
    
    [database]
    host = postgres
    port = 5432
    user = appuser
    
    [logging]
    level = info
    file = /var/log/app.log

---
# ConfigMap used in Pod - Environment Variables
apiVersion: v1
kind: Pod
metadata:
  name: app-with-config-env
spec:
  containers:
  - name: app
    image: myapp:latest
    
    # Method 1: Individual environment variables from ConfigMap
    env:
    - name: DATABASE_HOST
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: database.host
    - name: DATABASE_PORT
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: database.port
    - name: LOG_LEVEL
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: log.level
    
    # Method 2: Load all ConfigMap keys as environment variables
    envFrom:
    - configMapRef:
        name: app-config
        # Optional: prefix all keys with APP_
        prefix: "APP_"

---
# ConfigMap used in Pod - Volume Mount
apiVersion: v1
kind: Pod
metadata:
  name: app-with-config-volume
spec:
  containers:
  - name: app
    image: myapp:latest
    
    # Mount ConfigMap as volume
    volumeMounts:
    - name: config
      mountPath: /etc/config
      readOnly: true
  
  # Define ConfigMap volume
  volumes:
  - name: config
    configMap:
      name: app-settings
      # Optional: Set file permissions
      defaultMode: 0644

---
# Deployment using ConfigMap
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: app
        image: myapp:latest
        
        # Environment variables from ConfigMap
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: database.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: database.port
        
        # Volume mount for configuration files
        volumeMounts:
        - name: config-files
          mountPath: /app/config
      
      volumes:
      - name: config-files
        configMap:
          name: app-settings

---
# ConfigMap with immutability (Kubernetes 1.21+)
apiVersion: v1
kind: ConfigMap
metadata:
  name: immutable-config
immutable: true  # ConfigMap cannot be modified after creation
data:
  setting1: "value1"
  setting2: "value2"
