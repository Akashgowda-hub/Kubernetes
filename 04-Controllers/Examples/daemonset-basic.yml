apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd-daemonset
  namespace: kube-system
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd
  # DaemonSet pods use local storage (no rolling update by default)
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      # Run on all nodes by default
      hostNetwork: false
      hostPID: false
      
      containers:
      - name: fluentd
        image: fluent/fluentd:v1.14-1.0
        ports:
        - containerPort: 24224
          name: forward
        
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        
        volumeMounts:
        # Mount node logs
        - name: varlog
          mountPath: /var/log
        # Mount container logs
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        # Mount fluentd configuration
        - name: config
          mountPath: /fluentd/etc/fluent.conf
          subPath: fluent.conf
      
      # Volumes
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: config
        configMap:
          name: fluentd-config
