apiVersion: v1
kind: Pod
metadata:
  name: pod-with-resources
  namespace: default
  labels:
    app: resource-demo
spec:
  containers:
  - name: app
    image: myapp:latest
    ports:
    - containerPort: 8080
    
    # Resource Requests (guaranteed minimum)
    # - Pod not scheduled if node doesn't have these resources
    resources:
      requests:
        cpu: "250m"           # 0.25 CPU cores
        memory: "256Mi"       # 256 Megabytes
      limits:
        cpu: "500m"           # Max 0.5 CPU cores
        memory: "512Mi"       # Max 512 Megabytes

---
# QoS Classes Example

# Guaranteed QoS (highest priority)
# requests == limits
apiVersion: v1
kind: Pod
metadata:
  name: pod-qos-guaranteed
spec:
  containers:
  - name: app
    image: app:latest
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"

---
# Burstable QoS (medium priority)
# requests < limits
apiVersion: v1
kind: Pod
metadata:
  name: pod-qos-burstable
spec:
  containers:
  - name: app
    image: app:latest
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

---
# BestEffort QoS (lowest priority)
# no requests or limits
apiVersion: v1
kind: Pod
metadata:
  name: pod-qos-best-effort
spec:
  containers:
  - name: app
    image: app:latest
