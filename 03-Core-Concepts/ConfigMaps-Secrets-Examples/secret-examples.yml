---
# Generic Secret - Base64 encoded values
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: default
type: Opaque  # Generic secret type
data:
  # Base64 encoded values (echo -n 'value' | base64)
  username: YWRtaW4=         # admin
  password: UGFzc3dvcmQxMjM= # Password123

---
# Generic Secret - String values (automatically base64 encoded)
apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
type: Opaque
stringData:
  # Use stringData for cleaner YAML (automatically encoded)
  api_key: "sk-1234567890abcdefghijklmnopqrstuvwxyz"
  api_secret: "my-secret-key-value"
  webhook_token: "whk_live_xxxxx"

---
# TLS Secret - For HTTPS certificates
apiVersion: v1
kind: Secret
metadata:
  name: tls-certificate
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  tls.crt: LS0tLS1CRUdJTi... # Base64 encoded certificate
  tls.key: LS0tLS1CRUdJTi... # Base64 encoded private key

---
# Docker Registry Secret - For private container registries
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
type: kubernetes.io/dockercfg
data:
  .dockercfg: |
    {
      "registry.example.com": {
        "username": "your-username",
        "password": "your-password",
        "email": "your-email@example.com",
        "auth": "base64-encoded-username:password"
      }
    }

---
# Secret used in Pod - Environment Variables
apiVersion: v1
kind: Pod
metadata:
  name: app-with-secret-env
spec:
  containers:
  - name: app
    image: myapp:latest
    
    # Method 1: Individual environment variables from Secret
    env:
    - name: DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: password
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: api-credentials
          key: api_key
    
    # Method 2: Load all Secret keys as environment variables
    envFrom:
    - secretRef:
        name: db-credentials
        prefix: "DB_"

---
# Secret used in Pod - Volume Mount
apiVersion: v1
kind: Pod
metadata:
  name: app-with-secret-volume
spec:
  containers:
  - name: app
    image: myapp:latest
    
    # Mount Secret as volume (automatically decoded from base64)
    volumeMounts:
    - name: db-credentials
      mountPath: /etc/secrets/db
      readOnly: true
    - name: tls-certs
      mountPath: /etc/tls
      readOnly: true
  
  # Define Secret volumes
  volumes:
  # Generic secret volume
  - name: db-credentials
    secret:
      secretName: db-credentials
      # Optional: Set file permissions
      defaultMode: 0400  # Read-only for owner
      # Optional: Map specific keys to filenames
      items:
      - key: username
        path: username.txt
        mode: 0400
      - key: password
        path: password.txt
        mode: 0400
  
  # TLS secret volume
  - name: tls-certs
    secret:
      secretName: tls-certificate
      defaultMode: 0400

---
# Pod with Private Registry Secret
apiVersion: v1
kind: Pod
metadata:
  name: app-with-private-registry
spec:
  # Use ImagePullSecret for private container registries
  imagePullSecrets:
  - name: docker-registry-secret
  
  containers:
  - name: app
    image: registry.example.com/private/myapp:latest

---
# Deployment with Secrets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mydb
  template:
    metadata:
      labels:
        app: mydb
    spec:
      # Private registry credentials
      imagePullSecrets:
      - name: docker-registry-secret
      
      containers:
      - name: postgres
        image: postgres:14
        ports:
        - containerPort: 5432
        
        # Environment variables from Secret
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        
        # Volume mount for credentials
        volumeMounts:
        - name: db-secret
          mountPath: /run/secrets/db
          readOnly: true
      
      volumes:
      - name: db-secret
        secret:
          secretName: db-credentials

---
# Best Practices for Secrets

# 1. Use stringData in YAML (cleaner than manual base64)
apiVersion: v1
kind: Secret
metadata:
  name: clean-secret
type: Opaque
stringData:
  username: admin
  password: MySecurePassword123!

# 2. Use immutable secrets (Kubernetes 1.21+)
---
apiVersion: v1
kind: Secret
metadata:
  name: immutable-secret
type: Opaque
immutable: true  # Cannot be modified after creation
stringData:
  api_key: "secret-value"

# 3. Use RBAC to control access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
  resourceNames: ["db-credentials"]  # Specific secret only

# 4. Secrets best practices checklist:
# ✓ Use encryption at rest (etcd encryption)
# ✓ Use RBAC to limit access
# ✓ Use immutable secrets when possible
# ✓ Rotate secrets regularly
# ✓ Don't log secret values
# ✓ Use external secret management (Vault, etc.)
# ✓ Never commit secrets to git
# ✓ Use sealed-secrets or external-secrets operator
